<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Amigo Secreto 2026 🎁</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff7f0,#f3efff);padding:18px;color:#29252f}
.card{width:100%;max-width:520px;background:#fff;border-radius:28px;padding:34px 24px;
text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.12)}
.emoji{font-size:52px}.hidden{display:none}h1{font-size:30px;margin:8px 0}
p{font-size:17px;line-height:1.5}.names{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}
button{border:0;border-radius:14px;padding:14px 10px;font-size:16px;cursor:pointer;
background:#f0eaff;color:#34244f;font-weight:700}
button:disabled{background:#ddd;color:#888;cursor:not-allowed}
.result{margin:22px 0;padding:25px 14px;border-radius:20px;background:#faf7ff}
.hello{font-size:22px}.secret{font-size:30px;font-weight:800;margin-top:9px}
.note{font-size:13px;color:#777}
@media(max-width:430px){.names{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<div class="card">
<section id="choose">
<div class="emoji">🎁</div>
<h1>Amigo Secreto 2026</h1>
<p>¿Quién eres? 👀</p>
<div class="names" id="names"></div>
<p class="note">🤫 Elige tu nombre una sola vez.</p>
</section>

<section id="result" class="hidden">
<div class="emoji">🎉</div>
<h1>¡Listo!</h1>
<div class="result">
<div class="hello" id="hello"></div>
<div>Tu amigo secreto es...</div>
<div class="secret" id="secret"></div>
</div>
<p>🤫 ¡No se lo cuentes a nadie!</p>
</section>

<section id="used" class="hidden">
<div class="emoji">🔒</div>
<h1>Este nombre ya fue utilizado</h1>
<p>Alguien ya reveló este nombre. Elige otro.</p>
<button onclick="showChoose()">Volver</button>
</section>

<section id="error" class="hidden">
<div class="emoji">⚠️</div>
<h1>No se pudo revelar</h1>
<p>Hubo un problema de conexión. Inténtalo de nuevo.</p>
<button onclick="showChoose()">Volver</button>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://iyrppuhdysccijisfjvu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GAkwygBAcbNF8xzzUOJDIg_6LSW0Kui";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const participantes = [
"Veronica","Angelly","Luz Dey","Mateo","Alessandra","Camila",
"Bibiana","Walter","Brajhan","Mariana","Luz Mery","Doreley",
"Doña Dolly","Luis Fernando"
];

const names = document.getElementById("names");

participantes.forEach(nombre => {
  const b = document.createElement("button");
  b.textContent = nombre;
  b.onclick = () => revelar(nombre, b);
  names.appendChild(b);
});

async function revelar(nombre, boton) {
  boton.disabled = true;
  const {data, error} = await supabaseClient.rpc("revelar_amigo", {p_nombre:nombre});
  if(error) {
    boton.disabled = false;
    cambiar("error");
    return;
  }
  if(!data || data.length === 0) {
    cambiar("used");
    return;
  }
  document.getElementById("hello").textContent = "Hola " + nombre + " 💕";
  document.getElementById("secret").textContent = data[0].amigo;
  cambiar("result");
}

function cambiar(id) {
  ["choose","result","used","error"].forEach(x => document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function showChoose() { cambiar("choose"); }
</script>
</body>
</html>
